name: Notify main website to rebuild

# Whenever content or images change on main (CMS publishes commit here),
# tell the main website repo to rebuild and redeploy. Uses a fine-grained
# PAT stored as the MAIN_SITE_DISPATCH_TOKEN secret — see README for setup.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'blog-images/**'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rebuild on Inevo-solutions-LLC/InEvo-website
        env:
          GH_TOKEN: ${{ secrets.MAIN_SITE_DISPATCH_TOKEN }}
        run: |
          curl -fL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Inevo-solutions-LLC/InEvo-website/dispatches \
            -d '{"event_type":"blog-content-updated","client_payload":{"source_commit":"${{ github.sha }}","actor":"${{ github.actor }}"}}'
